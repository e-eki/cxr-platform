# Application
spring.application.name=case-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/case_db
spring.datasource.username=cxr_user
spring.datasource.password=cxr_pass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=default

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=cxr_minio
minio.secret-key=cxr_minio_pass
minio.bucket-name=cxr-images

# Kafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Kafka ? consumer
spring.kafka.consumer.group-id=case-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=io.github.eeki.cxr.caseservice.dto
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.eeki.cxr.caseservice.dto.InferenceCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# ??????
app.kafka.topics.image-uploaded=cxr.image.uploaded
app.kafka.topics.inference-completed=cxr.inference.completed
app.kafka.topics.inference-failed=cxr.inference.failed

