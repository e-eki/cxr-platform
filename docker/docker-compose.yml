services:
  postgres:
    image: postgres:16-alpine
    container_name: cxr-postgres
    environment:
      # Local development credentials. Never use in production.
      POSTGRES_DB: postgres
      POSTGRES_USER: cxr_user
      POSTGRES_PASSWORD: cxr_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  minio:
    image: rustfs/rustfs:latest
    container_name: cxr-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      # Local development credentials. Never use in production.
      RUSTFS_ACCESS_KEY: cxr_minio
      RUSTFS_SECRET_KEY: cxr_minio_pass
    volumes:
      - minio_data:/data

  kafka:
    image: apache/kafka:latest
    container_name: cxr-kafka
    ports:
      - "9092:9092"    # внутренний listener (для сервисов в docker-сети)
      - "29092:29092"  # внешний listener (для хоста — IDEA, curl)
    environment:
      # KRaft mode — single node acting as both broker and controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: cxr-kafka-cluster-01
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    container_name: cxr-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic cxr.image.uploaded \
          --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic cxr.inference.completed \
          --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic cxr.inference.failed \
          --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic cxr.case.reviewed \
          --partitions 1 --replication-factor 1
        echo "Topics created successfully:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cxr-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cxr-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      - kafka

  ml-inference:
    build:
      context: ../ml-inference
      dockerfile: Dockerfile
    container_name: cxr-ml-inference
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: ml-inference-group
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: cxr_minio
      S3_SECRET_KEY: cxr_minio_pass
      S3_BUCKET: cxr-images
      MODEL_PATH: /app/models/best.pt
    volumes:
      - ../ml-inference/models:/app/models:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

volumes:
  postgres_data:
    name: cxr_postgres_data
  minio_data:
    name: cxr_minio_data
  kafka_data:
    name: cxr_kafka_data