services:
  postgres:
    image: postgres:16-alpine
    container_name: cxr-postgres
    environment:
      # Local development credentials. Never use in production.
      POSTGRES_DB: postgres
      POSTGRES_USER: cxr_user
      POSTGRES_PASSWORD: cxr_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

volumes:
  postgres_data:
    name: cxr_postgres_data